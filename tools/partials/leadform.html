<!-- Project enquiry form (native HTML). Posts to Zoho Forms "ContactUs" through its HTML-records endpoint,
     so submissions arrive in Zoho exactly as before. Field names must not change (Zoho maps by name).
     Original Zoho export: tools/forms/zoho-contact-us/. Behaviour: js/leadform.js. -->
<form class="lead-form" method="POST" accept-charset="UTF-8" enctype="multipart/form-data" novalidate data-lead-form
    action="https://forms.zohopublic.in/adminzudo1/form/ContactUs/formperma/-2O-xogFpewMkKnJNAO2tuo5DCPdO503pMKxHX229HY/htmlRecords/submit">
    <input type="hidden" name="zf_referrer_name" value="">
    <input type="hidden" name="zf_redirect_url" value="https://zudoworks.com/thank-you/">
    <input type="hidden" name="zc_gad" value="">
    <div class="lead-form-grid">
        <label class="lead-field">
            <span class="lead-label">Full name <em aria-hidden="true">*</em></span>
            <input type="text" name="SingleLine" maxlength="255" autocomplete="name" placeholder="Your name"
                required data-check="required">
            <span class="lead-error" data-msg="Please enter your name."></span>
        </label>
        <label class="lead-field">
            <span class="lead-label">Work email <em aria-hidden="true">*</em></span>
            <input type="email" name="Email" maxlength="255" autocomplete="email" inputmode="email"
                placeholder="you@company.com" required data-check="email">
            <span class="lead-error" data-msg="Please enter a valid email address."></span>
        </label>
        <label class="lead-field">
            <span class="lead-label">Phone or WhatsApp <small>optional</small></span>
            <input type="tel" name="PhoneNumber_countrycode" maxlength="20" autocomplete="tel" inputmode="tel"
                placeholder="+1 555 123 4567" data-check="phone">
            <span class="lead-error" data-msg="Use digits, spaces, + ( ) - or . only."></span>
        </label>
        <label class="lead-field">
            <span class="lead-label">Company <small>optional</small></span>
            <input type="text" name="SingleLine1" maxlength="255" autocomplete="organization"
                placeholder="Company name">
            <span class="lead-error"></span>
        </label>
        <label class="lead-field lead-field--wide">
            <span class="lead-label">What can we help with?</span>
            <select name="Dropdown">
                <option value="-Select-" selected>Choose a service area</option>
                <option value="Zoho Implementation">Zoho Implementation</option>
                <option value="Zoho Customization">Zoho Customization</option>
                <option value="Custom Software Development">Custom Software Development</option>
                <option value="System Integrations">System Integrations</option>
                <option value="Business Automation">Business Automation</option>
                <option value="Data Migration">Data Migration</option>
                <option value="Ongoing Support &amp; Maintenance">Ongoing Support &amp; Maintenance</option>
                <option value="Other">Other</option>
            </select>
            <span class="lead-error"></span>
        </label>
        <label class="lead-field lead-field--wide">
            <span class="lead-label">Tell us about your project</span>
            <textarea name="MultiLine" maxlength="65535" rows="4"
                placeholder="What you use today, what is slowing your team down, and what you would like to change."></textarea>
            <span class="lead-error"></span>
        </label>
    </div>
    <div class="lead-form-foot">
        <button type="submit" class="btn btn-lead btn-lg lead-submit">
            <span class="lead-submit-text">Submit</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <p class="lead-form-note">We reply within one business day. Your details are only used to reply;
            see our <a href="/privacy/">Privacy Policy</a>.</p>
    </div>
    <p class="lead-form-status" role="status" aria-live="polite"></p>
</form>
<div class="lead-success" hidden>
    <span class="lead-success-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
    <h3>Thanks, your details are on their way</h3>
    <p>We read every enquiry ourselves and reply within one business day, usually with a few questions or times
        for a call.</p>
    <a href="/contact/" class="btn btn-secondary" data-booking>Book a call now instead</a>
</div>
