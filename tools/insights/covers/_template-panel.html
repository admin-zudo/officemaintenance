<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url('../../../Asset/fonts/inter-latin.woff2') format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#1A1A2E;
 background:radial-gradient(900px 700px at 78% 30%,#ffffff 0%,rgba(255,255,255,0) 70%),linear-gradient(135deg,#EAF2FB 0%,#F3F6FB 45%,#E3EEF9 100%)}
.scene{position:absolute;inset:0;transform-origin:50% 50%;transform:scale(var(--z,1))}
/* left text panel */
.panel{position:absolute;left:56px;top:56px;bottom:56px;width:560px;background:#fff;border-radius:28px;padding:48px 48px 0;
 box-shadow:0 30px 60px -30px rgba(27,90,150,.35),0 2px 0 rgba(255,255,255,.9) inset;border:1px solid #E5ECF4}
.tag{display:inline-block;background:#226DB4;color:#fff;font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:10px 20px;border-radius:999px}
h1{font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-.025em;margin-top:34px}
.sub{font-size:27px;line-height:1.4;color:#3D3D4E;margin-top:30px}
.rule{height:1px;background:#E5E7EB;margin-top:44px}
.take{font-size:27px;line-height:1.3;font-weight:700;color:#226DB4;margin-top:34px}
.dash{display:flex;gap:12px;margin-top:38px}.dash i{height:5px;border-radius:3px;display:block}
.brand{position:absolute;left:48px;bottom:44px;display:flex;align-items:center;gap:14px;font-size:27px;font-weight:700}
.brand img{width:48px;height:48px}
/* right diagram */
.art{position:absolute;left:660px;right:40px;top:40px;bottom:40px}
.ring{position:absolute;border-radius:50%;border:2px dashed rgba(34,109,180,.22)}
.node{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 background:#fff;box-shadow:0 26px 50px -22px rgba(27,90,150,.45),0 0 0 10px rgba(255,255,255,.55)}
.node b{font-size:25px;font-weight:800;line-height:1.15}.node span{font-size:18px;color:#6B7280;margin-top:6px}
.node svg{margin-bottom:10px}
.chip{position:absolute;background:#fff;border-radius:999px;padding:11px 20px;font-size:19px;font-weight:700;white-space:nowrap;
 box-shadow:0 14px 28px -14px rgba(27,90,150,.4);display:flex;align-items:center;gap:10px}
.chip i{width:12px;height:12px;border-radius:50%;display:block}
svg.wire{position:absolute;inset:0;width:100%;height:100%}
</style></head><body><div class="scene">
<div class="panel">
 <span class="tag">Zoho MCP</span>
 <h1>Give AI the right access.</h1>
 <p class="sub">Let an assistant read first. Add changes only with a confirmation step.</p>
 <div class="rule"></div>
 <p class="take">The tool list is your main control.</p>
 <div class="dash"><i style="width:150px;background:#226DB4"></i><i style="width:56px;background:#F9B21D"></i></div>
 <div class="brand"><img src="../../../Asset/brand/zudo-works-logo.svg" alt="">Zudo Works</div>
</div>
<div class="art">
 <div class="ring" style="left:250px;top:190px;width:440px;height:440px"></div>
 <div class="ring" style="left:170px;top:110px;width:600px;height:600px;border-color:rgba(34,109,180,.12)"></div>
 <svg class="wire" viewBox="0 0 900 820" fill="none">
  <path d="M190 410 H 330" stroke="#226DB4" stroke-width="5" stroke-linecap="round"/>
  <path d="M610 410 C 670 410 670 208 725 208" stroke="#089949" stroke-width="5" stroke-linecap="round"/>
  <path d="M610 410 H 725" stroke="#F9B21D" stroke-width="5" stroke-linecap="round"/>
  <path d="M610 410 C 670 410 670 612 725 612" stroke="#E42527" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 14"/>
 </svg>
 <div class="node" style="left:20px;top:320px;width:180px;height:180px">
  <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#226DB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.5A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h4"/></svg>
  <b>AI assistant</b></div>
 <div class="node" style="left:330px;top:270px;width:280px;height:280px;box-shadow:0 30px 60px -22px rgba(27,90,150,.5),0 0 0 14px rgba(34,109,180,.12)">
  <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#226DB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
  <b>Zoho MCP server</b><span>only the tools you add</span></div>
 <div class="node" style="left:725px;top:120px;width:176px;height:176px"><b style="color:#067A3B">Read</b><span>allow from<br>day one</span></div>
 <div class="node" style="left:725px;top:322px;width:176px;height:176px"><b style="color:#B37A00">Create</b><span>ask first</span></div>
 <div class="node" style="left:725px;top:524px;width:176px;height:176px"><b style="color:#C41F21">Delete</b><span>keep out</span></div>
</div>
</div></body></html>
