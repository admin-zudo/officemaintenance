<div class="main formula c" data-block><div class="eq">Safety stock = (max daily use &times; max lead time) &minus; (avg daily use &times; avg lead time)</div><div class="ex" style="--n:4"><div><b>55</b><span>most used in a day</span></div><div><b>10</b><span>longest lead time, days</span></div><div><b>40</b><span>average used per day</span></div><div><b>7</b><span>average lead time, days</span></div></div><div class="res">Safety stock = (55 &times; 10) &minus; (40 &times; 7) = 550 &minus; 280 = 270 hinges</div></div>
